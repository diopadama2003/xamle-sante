# Profil PRODUCTION : active avec la variable SPRING_PROFILES_ACTIVE=prod
# Aucun secret ici : tout vient des variables d'environnement de l'hebergeur.
# Si une variable sans valeur par defaut manque, l'application refuse de demarrer (voulu).

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}

app.admin.email=${ADMIN_EMAIL:admin@xamle.sn}
app.admin.password=${ADMIN_PASSWORD}
app.moderateur.email=${MODERATEUR_EMAIL:moderateur@xamle.sn}
app.moderateur.password=${MODERATEUR_PASSWORD}

app.demo-data=${DEMO_DATA:true}
app.sms.provider=${SMS_PROVIDER:log}

spring.jpa.show-sql=false

# Swagger reste actif pour la soutenance ; mettre SWAGGER_ENABLED=false pour le fermer
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
