spring.application.name=xamle
spring.profiles.active=local

# Base de donnees
spring.datasource.url=jdbc:postgresql://localhost:5432/xamle_sante
spring.datasource.username=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# JWT
app.jwt.expiration-ms=86400000
# SMS : "log" = simule dans la console, "twilio" = envoi reel
app.sms.provider=log

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Comptes crees au demarrage (valeurs de DEVELOPPEMENT uniquement).
# En production, application-prod.properties les remplace par des variables d'environnement.
app.admin.email=admin@xamle.sn
app.admin.password=Admin@2026
app.moderateur.email=moderateur@xamle.sn
app.moderateur.password=Modo@2026

# Donnees de demonstration (etablissements, campagnes, signalements fictifs)
app.demo-data=true

# Hebergement : port impose par la plateforme, et vraie adresse IP du visiteur derriere le proxy
server.port=${PORT:8080}
server.forward-headers-strategy=native
